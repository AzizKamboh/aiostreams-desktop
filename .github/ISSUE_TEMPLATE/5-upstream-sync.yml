name: '🔁 Regression after an upstream update'
description: 'Something broke after the integrated app took a new upstream release'
labels: ['regression', 'integrated']
body:
  - type: markdown
    attributes:
      value: |
        This tracker is for the **unofficial integrated Windows build** only. If the same problem happens in the official AIOStreams server or apps, report it to [Viren070/AIOStreams](https://github.com/Viren070/AIOStreams/issues) instead. Never report integrated-build problems upstream.
  - type: input
    id: version
    attributes:
      label: Integrated app version
      description: Settings → Updates or Settings → Local server → Versions (for example 0.3.0).
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Install type
      options: [Installer (Setup.exe), Portable ZIP]
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2 x64
    validations:
      required: true
  - type: textarea
    id: last-good
    attributes:
      label: "Last integrated version that worked"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: "What broke?"
      description: "Steps to reproduce. Say whether the official AIOStreams app or server shows the same problem."
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Settings → Local server → Read diagnostics, or the log from Open logs. Remove passwords, API keys, tokens and private URLs first.
      render: text
