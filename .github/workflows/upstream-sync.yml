name: Upstream Sync

# Daily: looks for a new stable Viren070/AIOStreams server or desktop release
# and, if there is one, merges it into a branch upstream-sync/<tag> and opens a
# pull request for review. It never pushes to main, never merges, never
# force-pushes and never touches the upstream repository. See docs/UPSTREAM-SYNC.md.
#
# Credentials: by default GITHUB_TOKEN. Two limits apply to it, so a GitHub App
# is recommended (docs/UPSTREAM-SYNC.md, "GitHub App"):
#  - Pull requests it opens do not start pull_request workflows. This workflow
#    therefore starts Pull Request CI and Integrated Windows desktop on the
#    branch with workflow_dispatch; their checks appear on the pull request.
#  - It cannot push commits that change .github/workflows. When an upstream
#    release does, the workflow opens an issue instead of a pull request.
on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: Optional. A specific stable upstream tag (vX.Y.Z or desktop-vX.Y.Z); default is the newest
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      status: ${{ steps.detect.outputs.status }}
      ref: ${{ steps.detect.outputs.ref }}
      branch: ${{ steps.detect.outputs.branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3
      - id: detect
        env:
          REF: ${{ inputs.ref }}
        run: |
          set -o pipefail
          node scripts/upstream/sync.mjs detect ${REF:+--ref "$REF"} | tee detect.json
          {
            echo "status=$(jq -r .status detect.json)"
            echo "ref=$(jq -r .target.ref detect.json)"
            echo "branch=$(jq -r .branch detect.json)"
          } >> "$GITHUB_OUTPUT"
          jq -r '"Upstream \(.target.ref) (\(.target.commit)): server \(.target.serverVersion), desktop \(.target.desktopVersion). Integrated: \(.baseline.ref) (\(.baseline.commit)). Status: \(.status)."' detect.json >> "$GITHUB_STEP_SUMMARY"

  sync:
    needs: detect
    if: needs.detect.outputs.status == 'available'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    env:
      BRANCH: ${{ needs.detect.outputs.branch }}
      REF: ${{ needs.detect.outputs.ref }}
      # sync.mjs adds a git remote named 'upstream' (Viren070/AIOStreams), and
      # gh prefers a remote with that name as its default repository, so pull
      # requests, labels and issues would be sent there. Pin gh to this repo.
      GH_REPO: ${{ github.repository }}
    steps:
      - name: GitHub App token (optional)
        id: app
        if: vars.UPSTREAM_SYNC_APP_ID != ''
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ vars.UPSTREAM_SYNC_APP_ID }}
          private-key: ${{ secrets.UPSTREAM_SYNC_APP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app.outputs.token || github.token }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3
      - name: Skip if this release already has a branch
        id: existing
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
        run: |
          pr=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            if [ -n "$pr" ]; then
              echo "Pull request #$pr already tracks $REF; nothing to do." | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::Branch $BRANCH exists without an open pull request. It is left untouched; delete it to prepare $REF again."
            fi
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Merge the upstream release into a sync branch
        if: steps.existing.outputs.skip != 'true'
        run: |
          git config user.name 'aiostreams-integrated-sync[bot]'
          git config user.email 'aiostreams-integrated-sync@users.noreply.github.com'
          node scripts/upstream/sync.mjs prepare --ref "$REF" --out "$RUNNER_TEMP/sync"
          cat "$RUNNER_TEMP/sync/result.json"
      - name: Push and open the pull request
        if: steps.existing.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          USING_APP: ${{ steps.app.outputs.token != '' }}
        run: |
          result="$RUNNER_TEMP/sync/result.json"
          status=$(jq -r .status "$result"); title=$(jq -r .title "$result"); base=$(jq -r .base "$result")
          body="$RUNNER_TEMP/sync/report.md"
          # A pull request body is limited to 65536 characters.
          if [ "$(wc -c < "$body")" -gt 60000 ]; then head -c 60000 "$body" > "$body.cut"; printf '\n\n…report truncated; run scripts/upstream/sync.mjs report locally.\n' >> "$body.cut"; mv "$body.cut" "$body"; fi
          if [ "$USING_APP" != true ] && [ -n "$(git diff --name-only "$base" HEAD -- .github/workflows)" ]; then
            # GITHUB_TOKEN may not push workflow changes. Report instead of dropping them.
            issue_title="Upstream $REF changes workflows: sync needs the GitHub App or a manual merge"
            {
              echo "Upstream $REF changes files under .github/workflows, which GITHUB_TOKEN cannot push."
              echo "Configure the sync GitHub App (docs/UPSTREAM-SYNC.md) and re-run **Upstream Sync**, or run locally:"
              echo; echo '```sh'; echo "node scripts/upstream/sync.mjs prepare --ref $REF"; echo "git push -u origin $BRANCH"; echo '```'; echo
              cat "$body"
            } > issue.md
            # The run summary first: the report must survive even when the issue cannot be filed.
            { echo "## $issue_title"; cat issue.md; } >> "$GITHUB_STEP_SUMMARY"
            filed=false
            existing=$(gh issue list --state open --search "in:title \"$issue_title\"" --json number --jq '.[0].number // empty' || true)
            if [ -n "$existing" ]; then
              if gh issue edit "$existing" --body-file issue.md; then filed=true; fi
            else
              if gh issue create --title "$issue_title" --body-file issue.md; then filed=true; fi
            fi
            if [ "$filed" = true ]; then
              echo "::warning::Opened an issue instead of a pull request: upstream changes workflows."
              exit 0
            fi
            echo "::error::Upstream $REF changes workflows, so this run may not push the merge, and the Actions token was refused when filing an issue. The full report is in this run's summary. Configure the sync GitHub App (docs/UPSTREAM-SYNC.md), or merge locally: node scripts/upstream/sync.mjs prepare --ref $REF && git push -u origin $BRANCH"
            exit 1
          fi
          git push origin "HEAD:refs/heads/$BRANCH"
          draft=(); [ "$status" = conflicted ] && draft=(--draft)
          # The label is cosmetic and needs issue-scope write, which the token may
          # not have. Never let it stop the pull request from being opened.
          label=()
          if gh label create upstream-sync --color 0e8a16 --description 'Automated upstream synchronisation' >/dev/null 2>&1 \
            || gh label list --search upstream-sync --json name --jq '.[].name' 2>/dev/null | grep -qx upstream-sync; then
            label=(--label upstream-sync)
          else
            echo "::warning::Could not create or find the upstream-sync label; opening the pull request without it."
          fi
          if ! gh pr create --base main --head "$BRANCH" --title "$title" --body-file "$body" "${label[@]}" "${draft[@]}"; then
            # The branch is already pushed, so the report must not die with this step.
            {
              echo "## $title"
              echo
              echo "Branch \`$BRANCH\` was pushed, but opening its pull request failed."
              echo "Open it by hand: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...$BRANCH"
              echo
              cat "$body"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Pushed $BRANCH but could not open its pull request. The full report is in this run's summary; open the pull request from that branch."
            exit 1
          fi
          if [ "$USING_APP" != true ]; then
            # Pull requests opened with GITHUB_TOKEN start no pull_request workflows.
            gh workflow run pr-ci.yml --ref "$BRANCH"
            gh workflow run embedded-desktop.yml --ref "$BRANCH"
          fi
          {
            echo "### $title"
            echo "Status: **$status**. Branch: \`$BRANCH\`."
            if [ "$status" = conflicted ]; then echo "Conflicted files: $(jq -r '.conflicts | join(", ")' "$result")"; fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Note superseded sync pull requests
        if: steps.existing.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
        run: |
          gh pr list --label upstream-sync --state open --json number,headRefName \
            --jq ".[] | select(.headRefName != \"$BRANCH\") | .number" | while read -r old; do
            gh pr comment "$old" --body "Superseded by the sync to upstream $REF (branch \`$BRANCH\`). Close this pull request once that one is reviewed; nothing was closed automatically."
          done

  # The bundled AIOMetadata (scripts/desktop/runtime-pins.json) follows its
  # author's Latest release. Independent of the AIOStreams sync above.
  aiometadata:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: GitHub App token (optional)
        id: app
        if: vars.UPSTREAM_SYNC_APP_ID != ''
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ vars.UPSTREAM_SYNC_APP_ID }}
          private-key: ${{ secrets.UPSTREAM_SYNC_APP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          token: ${{ steps.app.outputs.token || github.token }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3
      - name: Look for a newer AIOMetadata release
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          node scripts/upstream/aiometadata.mjs detect | tee detect.json
          {
            echo "status=$(jq -r .status detect.json)"
            echo "tag=$(jq -r '.target.tag // empty' detect.json)"
            echo "branch=$(jq -r '.branch // empty' detect.json)"
          } >> "$GITHUB_OUTPUT"
          jq -r '"AIOMetadata: \(.reason)"' detect.json >> "$GITHUB_STEP_SUMMARY"
      - name: Skip if this release already has a branch
        id: existing
        if: steps.detect.outputs.status == 'available'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          BRANCH: ${{ steps.detect.outputs.branch }}
        run: |
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            echo "Branch $BRANCH already exists; nothing to do." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Update the pin and open the pull request
        if: steps.detect.outputs.status == 'available' && steps.existing.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          USING_APP: ${{ steps.app.outputs.token != '' }}
          TAG: ${{ steps.detect.outputs.tag }}
          BRANCH: ${{ steps.detect.outputs.branch }}
        run: |
          git config user.name 'aiostreams-integrated-sync[bot]'
          git config user.email 'aiostreams-integrated-sync@users.noreply.github.com'
          git switch -c "$BRANCH"
          node scripts/upstream/aiometadata.mjs prepare --tag "$TAG" --out "$RUNNER_TEMP/aiometadata"
          title=$(jq -r .title "$RUNNER_TEMP/aiometadata/result.json")
          git add -A scripts/desktop/runtime-pins.json docs
          git commit -m "$title"
          git push origin "HEAD:refs/heads/$BRANCH"
          label=()
          if gh label create upstream-sync --color 0e8a16 --description 'Automated upstream synchronisation' >/dev/null 2>&1 \
            || gh label list --search upstream-sync --json name --jq '.[].name' 2>/dev/null | grep -qx upstream-sync; then
            label=(--label upstream-sync)
          fi
          gh pr create --base main --head "$BRANCH" --title "$title" --body-file "$RUNNER_TEMP/aiometadata/report.md" "${label[@]}"
          if [ "$USING_APP" != true ]; then
            # Pull requests opened with GITHUB_TOKEN start no pull_request workflows.
            gh workflow run pr-ci.yml --ref "$BRANCH"
            gh workflow run embedded-desktop.yml --ref "$BRANCH"
          fi
          echo "### $title" >> "$GITHUB_STEP_SUMMARY"
