name: Integrated Windows desktop

# Builds and tests on every push. A manual run can also create a DRAFT GitHub
# release from the tested artifacts; publishing it stays a manual step. Only the
# small release job has write permission, and it never checks out or runs code.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Integrated app SemVer (also the release tag, prefixed with v)
        type: string
        default: '0.1.0'
      draft_release:
        description: Create a draft GitHub release from the tested build
        type: boolean
        default: false
  pull_request:
    paths:
      - 'packages/desktop/**'
      - 'packages/server/**'
      - 'packages/core/**'
      - 'packages/web/**'
      - 'packages/frontend/**'
      - 'scripts/desktop/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/embedded-desktop.yml'

permissions:
  contents: read

concurrency:
  group: embedded-desktop-${{ github.ref }}
  # Finish expensive native builds; GitHub keeps only the newest pending run.
  cancel-in-progress: false

jobs:
  windows-x64:
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.0.8
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.1
          cache: pnpm
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop
          cache-on-failure: true
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            curl
            tar
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-zlib
      - name: Build bundled ffprobe from verified source
        shell: msys2 {0}
        run: bash scripts/desktop/build-ffprobe.sh
      - name: Build, test, stage, and package
        env:
          PACKAGE_VERSION: ${{ inputs.version || '0.1.0' }}
        run: ./scripts/desktop/package-windows.ps1 -Version $env:PACKAGE_VERSION
      - name: Backend with runtime-discovery paths removed
        run: |
          $node = Join-Path $PWD '.embedded-build/stage/backend/node.exe'
          $runtime = Join-Path $PWD '.embedded-build/stage/backend/app'
          $probe = Join-Path $PWD '.embedded-build/stage/backend/bin/ffprobe.exe'
          $env:PATH = "$env:SystemRoot/system32;$env:SystemRoot"
          & $node scripts/desktop/smoke.mjs --app-root $runtime --node $node --ffprobe $probe
          if ($LASTEXITCODE -ne 0) { throw 'Packaged runtime smoke test failed.' }
      - name: Install, play through native WebView2 and mpv, and upgrade
        run: ./scripts/desktop/test-windows.ps1
      - name: Upload native test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aiostreams-native-evidence
          path: .embedded-build/native-evidence
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Upload installer, portable build, source, and hashes
        uses: actions/upload-artifact@v7
        with:
          name: aiostreams-integrated-windows-x64
          include-hidden-files: true
          path: |
            .embedded-releases/*Setup.exe
            .embedded-releases/*Portable.zip
            .embedded-releases/*source.tar.gz
            .embedded-releases/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  draft-release:
    needs: windows-x64
    if: github.event_name == 'workflow_dispatch' && inputs.draft_release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: v${{ inputs.version }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: aiostreams-integrated-windows-x64
          path: dist
      - name: Verify checksums
        working-directory: dist
        run: sha256sum -c SHA256SUMS.txt
      - name: Create draft release (not published)
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Delete the draft or choose a new version."
            exit 1
          fi
          {
            echo "Unofficial integrated Windows build of [AIOStreams](https://github.com/Viren070/AIOStreams) by Viren070 (AGPL-3.0-only)."
            echo
            echo "Built from commit ${GITHUB_SHA} by [workflow run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})."
            echo "Installer and portable ZIP are **unsigned**. Complete corresponding source is attached."
            echo
            echo "See RELEASE-NOTES.md and README-INTEGRATED.md in the repository for details and known limitations."
            echo
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
          } > notes.md
          gh release create "$TAG" --draft --target "$GITHUB_SHA" \
            --title "AIOStreams Integrated $TAG" --notes-file notes.md dist/*

