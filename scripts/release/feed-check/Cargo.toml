# Checks a published (or local) Velopack feed with the same Velopack version and
# integrated update rules as the app. Not shipped; used by the release workflows.
[package]
name = "aiostreams-integrated-feed-check"
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[dependencies]
